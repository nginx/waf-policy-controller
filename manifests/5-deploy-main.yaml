# Source: f5-waf-policy-controller/templates/policy-controller-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: waf-policy-controller-f5-waf-policy-controller
  namespace: default
  labels:
    helm.sh/chart: f5-waf-policy-controller-5.13.1
    app.kubernetes.io/name: f5-waf-policy-controller
    app.kubernetes.io/instance: waf-policy-controller
    app.kubernetes.io/version: "5.13.1"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: policy-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app: waf-policy-controller-f5-waf-policy-controller
      app.kubernetes.io/name: f5-waf-policy-controller
      app.kubernetes.io/instance: waf-policy-controller
  template:
    metadata:
      labels:
        app: waf-policy-controller-f5-waf-policy-controller
        app.kubernetes.io/name: f5-waf-policy-controller
        app.kubernetes.io/instance: waf-policy-controller
    spec:
      serviceAccountName: waf-policy-controller-f5-waf-policy-controller-sa
      initContainers:
        - name: wait-for-redis-and-s3
          image: "curlimages/curl:8.8.0"
          imagePullPolicy: IfNotPresent
          command: ["sh", "-euc"]
          args:
            - |
              timeout="300"
              end=$(( $(date +%s) + timeout ))
              redis_host="waf-policy-controller-f5-waf-redis-service"
              redis_port="6379"
              s3_url="http://waf-policy-controller-f5-waf-seaweed-filer.default.svc.cluster.local:8333"
              curl_args=""

              echo "Waiting for Redis at ${redis_host}:${redis_port} (timeout ${timeout}s)"
              until nc -z -w 2 "${redis_host}" "${redis_port}"; do
                if [ "$(date +%s)" -ge "${end}" ]; then
                  echo "Timed out waiting for Redis"
                  exit 1
                fi
                sleep 2
              done

              echo "Waiting for S3 endpoint ${s3_url} (timeout ${timeout}s)"
              # SeaweedFS S3 typically returns 403 on unauthenticated root path, so we treat any HTTP response as "reachable".
              until curl ${curl_args} -s -f -m 2 "${s3_url}" >/dev/null 2>&1 || \
                curl ${curl_args} -s -I -m 2 "${s3_url}" 2>&1 | grep -q "HTTP/"; do
                if [ "$(date +%s)" -ge "${end}" ]; then
                  echo "Timed out waiting for S3 endpoint"
                  exit 1
                fi
                sleep 2
              done
      containers:
        - name: policy-controller
          image: "private-registry.nginx.com/nap/waf-policy-controller:5.13.1"
          imagePullPolicy: IfNotPresent
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: LOG_LEVEL
              value: "info"
            - name: S3_ENDPOINT
              value: "http://waf-policy-controller-f5-waf-seaweed-filer.default.svc.cluster.local:8333"
            - name: S3_ACCESS_KEY_ID
              value: "adminKey"
            - name: S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: waf-policy-controller-f5-waf-seaweedfs-auth
                  key: seaweedfs_admin_secret
            - name: DEPLOYMENT_NAME
              value: waf-policy-controller-f5-waf-policy-controller
            - name: POLICY_COMPILER_VERSION
              value: 5.13.1
            - name: REDIS_ADDR
              valueFrom:
                configMapKeyRef:
                  name: waf-policy-controller-f5-waf-policy-manager-config
                  key: redis-addr
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: waf-policy-controller-f5-waf-redis-secret
                  key: password
            - name: REDIS_DB
              valueFrom:
                configMapKeyRef:
                  name: waf-policy-controller-f5-waf-policy-manager-config
                  key: redis-db
            - name: ENABLE_REDIS_QUEUE
              valueFrom:
                configMapKeyRef:
                  name: waf-policy-controller-f5-waf-policy-manager-config
                  key: enable-redis-queue
            - name: AWS_EC2_METADATA_DISABLED
              value: "true"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - all
            readOnlyRootFilesystem: true
            runAsGroup: 101
            runAsNonRoot: true
            runAsUser: 101
          volumeMounts:
            - name: transient-storage
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
      volumes:
        - name: transient-storage
          emptyDir:
            sizeLimit: 200Mi
