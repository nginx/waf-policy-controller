# Source: f5-waf-policy-controller/templates/compiler-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: waf-policy-controller-f5-waf-compiler-service
  namespace: default
  labels:
    helm.sh/chart: f5-waf-policy-controller-5.13.1
    app.kubernetes.io/name: f5-waf-policy-controller
    app.kubernetes.io/instance: waf-policy-controller
    app.kubernetes.io/version: "5.13.1"
    app.kubernetes.io/managed-by: Helm
    app: waf-policy-controller-f5-waf-compiler-service
    component: compiler-service
    app.kubernetes.io/component: compiler
  annotations:
    appprotect.f5.com/compiler-version: 5.13.1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: waf-policy-controller-f5-waf-compiler-service
      component: compiler-service
      app.kubernetes.io/name: f5-waf-policy-controller
      app.kubernetes.io/instance: waf-policy-controller
  template:
    metadata:
      labels:
        app: waf-policy-controller-f5-waf-compiler-service
        component: compiler-service
        app.kubernetes.io/name: f5-waf-policy-controller
        app.kubernetes.io/instance: waf-policy-controller
        app.kubernetes.io/component: compiler
    spec:
      automountServiceAccountToken: false
      volumes:
        - name: logs
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: opt-app-protect
          emptyDir: {}
      initContainers:
        - name: init-app-protect
          image: "private-registry.nginx.com/nap/waf-compiler:5.13.1"
          command: ["sh", "-c", "cp -a /opt/app_protect/* /init_copy/"]
          volumeMounts:
            - name: opt-app-protect
              mountPath: /init_copy
        - name: wait-for-redis
          image: "curlimages/curl:8.8.0"
          imagePullPolicy: IfNotPresent
          command: ["sh", "-euc"]
          args:
            - |
              timeout="300"
              end=$(( $(date +%s) + timeout ))
              redis_host="waf-policy-controller-f5-waf-redis-service"
              redis_port="6379"

              echo "Waiting for Redis at ${redis_host}:${redis_port} (timeout ${timeout}s)"
              until nc -z -w 2 "${redis_host}" "${redis_port}"; do
                if [ "$(date +%s)" -ge "${end}" ]; then
                  echo "Timed out waiting for Redis"
                  exit 1
                fi
                sleep 2
              done
      containers:
        - name: waf-policy-controller-f5-waf-compiler-service
          image: "private-registry.nginx.com/nap/waf-compiler:5.13.1"
          command: ["/opt/app_protect/bin/compiler-service"]
          imagePullPolicy: IfNotPresent
          env:
            - name: POLICY_COMPILER_VERSION
              value: 5.13.1
            - name: REDIS_URL
              value: "redis://waf-policy-controller-f5-waf-redis-service:6379"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: waf-policy-controller-f5-waf-redis-secret
                  key: password
            - name: S3_ENDPOINT
              value: "http://waf-policy-controller-f5-waf-seaweed-filer.default.svc.cluster.local:8333"
            - name: S3_ACCESS_KEY_ID
              value: "adminKey"
            - name: S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: waf-policy-controller-f5-waf-seaweedfs-auth
                  key: seaweedfs_admin_secret
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - all
            readOnlyRootFilesystem: true
            runAsGroup: 101
            runAsNonRoot: true
            runAsUser: 101
          volumeMounts:
            - name: opt-app-protect
              mountPath: /opt/app_protect
            - name: tmp
              mountPath: /tmp
            - name: logs
              mountPath: /var/log/app_protect
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
