# Source: f5-waf-policy-controller/templates/redis-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: waf-policy-controller-f5-waf-redis
  namespace: default
  labels:
    app: waf-policy-controller-f5-waf-redis
    component: redis
    app.kubernetes.io/name: redis
    app.kubernetes.io/instance: waf-policy-controller
    app.kubernetes.io/component: policyController
spec:
  replicas: 1
  selector:
    matchLabels:
      app: waf-policy-controller-f5-waf-redis
      component: redis
      app.kubernetes.io/instance: waf-policy-controller
  template:
    metadata:
      labels:
        app: waf-policy-controller-f5-waf-redis
        component: redis
        app.kubernetes.io/name: redis
        app.kubernetes.io/instance: waf-policy-controller
        app.kubernetes.io/component: policyController
    spec:
      automountServiceAccountToken: false
      containers:
        - name: redis
          image: "private-registry.nginx.com/nap/waf-redis:5.13.1"
          imagePullPolicy: IfNotPresent
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: waf-policy-controller-f5-waf-redis-secret
                  key: password
          command:
            - redis-server
            - "/etc/redis/redis.conf"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - all
            readOnlyRootFilesystem: true
            runAsGroup: 999
            runAsNonRoot: true
            runAsUser: 999
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
          volumeMounts:
            - name: redis-data
              mountPath: /data
            - name: redis-config
              mountPath: /etc/redis
              readOnly: true
          readinessProbe:
            exec:
              command:
                - redis-cli
                - -a
                - "$(REDIS_PASSWORD)"
                - ping
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command:
                - redis-cli
                - -a
                - "$(REDIS_PASSWORD)"
                - ping
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: redis-data
          emptyDir: {}
        - name: redis-config
          secret:
            secretName: waf-policy-controller-f5-waf-redis-secret
            items:
              - key: redis.conf
                path: redis.conf
