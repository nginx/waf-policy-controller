# Source: f5-waf-policy-controller/templates/compiler-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: waf-policy-controller-f5-waf-compiler-service
  namespace: default
  labels:
    helm.sh/chart: f5-waf-policy-controller-5.15.0
    app.kubernetes.io/name: f5-waf-policy-controller
    app.kubernetes.io/instance: waf-policy-controller
    app.kubernetes.io/version: "5.15.0"
    app.kubernetes.io/managed-by: Helm
    app: waf-policy-controller-f5-waf-compiler-service
    component: compiler-service
    app.kubernetes.io/component: compiler
  annotations:
    appprotect.f5.com/compiler-version: 5.15.0
spec:
  replicas: 1
  selector:
    matchLabels:
      app: waf-policy-controller-f5-waf-compiler-service
      component: compiler-service
      app.kubernetes.io/name: f5-waf-policy-controller
      app.kubernetes.io/instance: waf-policy-controller
  template:
    metadata:
      labels:
        app: waf-policy-controller-f5-waf-compiler-service
        component: compiler-service
        app.kubernetes.io/name: f5-waf-policy-controller
        app.kubernetes.io/instance: waf-policy-controller
        app.kubernetes.io/component: compiler
    spec:
      automountServiceAccountToken: false
      volumes:
        - name: logs
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: opt-app-protect
          emptyDir: {}
      initContainers:
        - name: init-app-protect
          image: "private-registry.nginx.com/nap/waf-compiler:5.15.0"
          command: ["sh", "-c", "cp -a /opt/app_protect/* /init_copy/"]
          volumeMounts:
            - name: opt-app-protect
              mountPath: /init_copy
      containers:
        - name: waf-policy-controller-f5-waf-compiler-service
          image: "private-registry.nginx.com/nap/waf-compiler:5.15.0"
          command: ["/opt/app_protect/bin/compiler-service"]
          args:
            - "--max-concurrent"
            - "4"
          imagePullPolicy: IfNotPresent
          ports:
            - name: grpc
              containerPort: 50051
              protocol: TCP
            - name: health
              containerPort: 8080
              protocol: TCP
          env:
            - name: POLICY_COMPILER_VERSION
              value: 5.15.0
            - name: GRPC_PORT
              value: "50051"
            - name: S3_ENDPOINT
              value: "http://waf-policy-controller-f5-waf-seaweed-filer.default.svc.cluster.local:8333"
            - name: S3_ACCESS_KEY_ID
              value: "adminKey"
            - name: S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: waf-policy-controller-f5-waf-seaweedfs-auth
                  key: seaweedfs_admin_secret
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - all
            readOnlyRootFilesystem: true
            runAsGroup: 101
            runAsNonRoot: true
            runAsUser: 101
          # Readiness must verify the gRPC service is actually SERVING (design §5.5),
          # not just that the HTTP /healthz listener on :8080 is up. The kubelet's
          # native grpc probe invokes grpc.health.v1.Health/Check with no extra
          # binary, but it is ignored on k8s < 1.24 (alpha/off; e.g. k3s 1.23 CI).
          # So use the native grpc probe wherever the cluster supports it, and fall
          # back to a tcpSocket check on the gRPC port for older clusters — that
          # still probes the real :50051 serving port (unlike httpGet /healthz) and
          # keeps readiness distinct from the /healthz liveness probe below.
          readinessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 10
            periodSeconds: 15
          volumeMounts:
            - name: opt-app-protect
              mountPath: /opt/app_protect
            - name: tmp
              mountPath: /tmp
            - name: logs
              mountPath: /var/log/app_protect
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
